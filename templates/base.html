<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Analisis Sentimen Tokopedia{% endblock %}</title>

<!-- Font Fredoka -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons (untuk ikon di navbar/kartu) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- AOS (Animate On Scroll) -->
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

<!-- CSS kustom (tema hijau-putih) -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top custom-navbar">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/">
      <i class="bi bi-shop-window me-2"></i>Sentimen Tokopedia
      <span class="badge-wknn">WKNN</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav ms-auto gap-lg-2">
        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-cloud-upload me-1"></i>Upload Data</a></li>
        <li class="nav-item"><a class="nav-link" href="/preprocessing"><i class="bi bi-magic me-1"></i>Preprocessing</a></li>
        <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-bar-chart-line me-1"></i>Dashboard</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4 fade-in-page">
  {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted small py-4">
  Sentimen Tokopedia — WKNN Engine · Dibuat untuk keperluan penelitian
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({ duration: 700, once: true, easing: "ease-out-cubic" });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
