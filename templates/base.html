<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Sentimen Tokopedia — WKNN{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- ============ NAVBAR (mobile & desktop) ============ -->
<nav class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">
      <span class="brand-icon"><i class="bi bi-shop-window"></i></span>
      <span>Sentimen Tokopedia</span>
      <span class="badge-wknn">WKNN</span>
    </a>

    <!-- Nav desktop -->
    <div class="desktop-nav d-none d-lg-flex">
      <a href="/" class="{{ 'is-active' if active_page == 'upload' else '' }}">Upload Data</a>
      <a href="/preprocessing" class="{{ 'is-active' if active_page == 'preprocessing' else '' }}">Preprocessing</a>
      <a href="/dashboard" class="{{ 'is-active' if active_page == 'dashboard' else '' }}">Dashboard</a>
    </div>

    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Buka menu">
      <i class="bi bi-list"></i>
    </button>
  </div>
</nav>

<!-- ============ FULLSCREEN MENU (mobile) ============ -->
<div class="fullscreen-menu" id="fullscreenMenu">
  <button class="close-menu-btn" id="closeMenuBtn" aria-label="Tutup menu">
    <i class="bi bi-x-lg"></i>
  </button>
  <div class="fullscreen-menu-content">
    <span class="fullscreen-menu-title">MENU</span>
    <a href="/" class="{{ 'is-active' if active_page == 'upload' else '' }}">Upload Data</a>
    <a href="/preprocessing" class="{{ 'is-active' if active_page == 'preprocessing' else '' }}">Preprocessing</a>
    <a href="/dashboard" class="{{ 'is-active' if active_page == 'dashboard' else '' }}">Dashboard</a>
  </div>
</div>

<main class="page-container">
  {% block content %}{% endblock %}
</main>

<footer class="footer-note">
  © 2026 Sentimen Tokopedia. Dibuat untuk analisis yang lebih baik.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const closeMenuBtn = document.getElementById("closeMenuBtn");
  const fullscreenMenu = document.getElementById("fullscreenMenu");

  hamburgerBtn.addEventListener("click", () => fullscreenMenu.classList.add("is-open"));
  closeMenuBtn.addEventListener("click", () => fullscreenMenu.classList.remove("is-open"));
  fullscreenMenu.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => fullscreenMenu.classList.remove("is-open")));
</script>
{% block scripts %}{% endblock %}
</body>
</html>
